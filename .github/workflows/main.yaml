      - name: Generate geosite-tld-cn
        run: |
          source ./func.sh
          NAME=tld-cn
          v2dat unpack geosite -o . -f ${NAME} ./dlc.dat
          v2ray_to_mihomo_classical_text ./dlc_${NAME}.txt ./publish/geosite/${NAME}.list
          mihomo_classical_text_to_singbox ./publish/geosite/${NAME}.list ./publish/geosite/${NAME}.json
          ./sing-box rule-set compile ./publish/geosite/${NAME}.json

      - name: Generate geosite-!cn2
        run: |
          source ./func.sh
          NAME='!cn2'
          mv ./rule-set/geosite/${NAME}.list ./publish/geosite/
          mihomo_classical_text_to_singbox ./publish/geosite/${NAME}.list ./publish/geosite/${NAME}.json
          ./sing-box rule-set compile ./publish/geosite/${NAME}.json

      - name: Generate geosite-!cn
        run: |
          source ./func.sh
          NAME='!cn'
          v2dat unpack geosite -o . -f 'geolocation-!cn' ./dlc.dat
          v2ray_to_mihomo_classical_text './dlc_geolocation-!cn.txt' ./publish/geosite/${NAME}.list
          mihomo_classical_text_to_singbox ./publish/geosite/${NAME}.list ./publish/geosite/${NAME}.json
          ./sing-box rule-set compile ./publish/geosite/${NAME}.json

      - name: Generate geosite-!cn@cn
        run: |
          source ./func.sh
          NAME='!cn@cn'
          v2dat unpack geosite -o . -f 'geolocation-!cn@cn' ./dlc.dat
          v2ray_to_mihomo_classical_text './dlc_geolocation-!cn@cn.txt' ./publish/geosite/${NAME}.list
          mihomo_classical_text_to_singbox ./publish/geosite/${NAME}.list ./publish/geosite/${NAME}.json
          ./sing-box rule-set compile ./publish/geosite/${NAME}.json

      - name: Generate geosite-reward
        run: |
          source ./func.sh
          NAME=reward
          curl -s https://raw.githubusercontent.com/lingeringsound/10007_auto/main/configure/保留奖励.prop | grep -v "^#" | sed '/^$/d' > ./publish/geosite/${NAME}.list
          mihomo_domain_text_to_singbox ./publish/geosite/${NAME}.list ./publish/geosite/${NAME}.json
          ./mihomo convert-ruleset domain text ./publish/geosite/${NAME}.list ./publish/geosite/${NAME}.mrs
          ./sing-box rule-set compile ./publish/geosite/${NAME}.json

      - name: Generate geosite-realip
        run: |
          source ./func.sh
          NAME=realip
          # go run ./d2c
          # mv output.list ./publish/geosite/${NAME}.list
          grep -E '^DOMAIN' ./rule-set/geosite/${NAME}.list > ./publish/geosite/${NAME}.list
          mihomo_classical_text_to_singbox ./publish/geosite/${NAME}.list ./publish/geosite/${NAME}.json
          ./sing-box rule-set compile ./publish/geosite/${NAME}.json

      - name: Generate geosite-vowifi-cn
        run: |
          source ./func.sh
          NAME=vowifi-cn
          # go run ./d2c
          # mv output.list ./publish/geosite/${NAME}.list
          grep -E '^DOMAIN' ./rule-set/geosite/${NAME}.list > ./publish/geosite/${NAME}.list
          mihomo_classical_text_to_singbox ./publish/geosite/${NAME}.list ./publish/geosite/${NAME}.json
          ./sing-box rule-set compile ./publish/geosite/${NAME}.json

      - name: Generate geoip-cn
        run: |
          source ./func.sh
          NAME=cn
          mkdir -p ./data
          go run ./bgp-parser
          mv chnroutes.txt ./publish/geoip/
          mv chnroutes6.txt ./publish/geoip/
          mv ${NAME}.list ./publish/geoip/
          mihomo_ipcidr_text_to_singbox ./publish/geoip/${NAME}.list ./publish/geoip/${NAME}.json
          ./mihomo convert-ruleset ipcidr text ./publish/geoip/${NAME}.list ./publish/geoip/${NAME}.mrs
          ./sing-box rule-set compile ./publish/geoip/${NAME}.json

      - name: Commit and push
        run: |
          cd publish || exit 1
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b release
          git add .
          git commit -m "Auto-update"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Purge jsdelivr CDN
        run: |
          cd publish || exit 1
          find . -type f \( -name "*.mrs" -o -name "*.list" -o -name "*.srs" -o -name "*.json" -o -name "*.txt" \) -print0 | while IFS= read -r -d '' path; do
            file_path="${path#./}"
            echo "Purging $file_path"
            curl -s -I "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/$file_path"
          done

      - name: Custom clean up workflow runs
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100
            })

            const now = new Date()
            console.log(now.toLocaleString('sv-SE'))
            const todayStr = now.toLocaleDateString('sv-SE')

            const yesterday = new Date(now)
            yesterday.setDate(yesterday.getDate() - 1)
            const yesterdayStr = yesterday.toLocaleDateString('sv-SE')

            const allowedDays = [todayStr, yesterdayStr]

            const keptRuns = new Set()

            for (const run of runs) {
              const dateString = new Date(run.created_at).toLocaleDateString('sv-SE')
              const cacheKey = `${run.workflow_id}-${dateString}`

              if (!allowedDays.includes(dateString)) {
                console.log(`[Delete] Run ${run.id} (${run.name}, ${dateString}) - Older than 2 days`)
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id })
                } catch (e) {
                  console.log(`Skipped or failed: ${e.message}`)
                }
                continue
              }

              if (keptRuns.has(cacheKey)) {
                console.log(`[Delete] Run ${run.id} (${run.name}, ${dateString}) - Not the latest for this date`)
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id })
                } catch (e) {
                  console.log(`Skipped or failed (possibly running): ${e.message}`)
                }
              } else {
                console.log(`[Retain] Run ${run.id} (${run.name}, ${dateString}) - Latest for this date`)
                keptRuns.add(cacheKey)
              }
            }

    env:
      TZ: Asia/Shanghai
